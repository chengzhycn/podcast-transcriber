services:
  funasr:
    build: ./funasr_server
    ports:
      - "18902:8000"          # 18902 on host → 8000 in container
    volumes:
      - funasr_models:/models  # model cache persists across restarts
    environment:
      - MODELSCOPE_CACHE=/models
    restart: unless-stopped
    # 4 models loaded simultaneously (paraformer + vad + punc + cam++) need >4GB
    # to load on CPU/PyTorch — give it nearly all of the Docker VM's ~7.65GB
    mem_limit: 7g

volumes:
  funasr_models:
