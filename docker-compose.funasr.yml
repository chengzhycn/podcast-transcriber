services:
  funasr:
    build: ./funasr_server
    ports:
      - "18902:8000"          # 18902 on host → 8000 in container
    volumes:
      - funasr_models:/models  # model cache persists across restarts
    environment:
      - MODELSCOPE_CACHE=/models
    restart: unless-stopped
    # Memory limit: paraformer-zh + cam++ uses ~2GB at peak
    mem_limit: 4g

volumes:
  funasr_models:
